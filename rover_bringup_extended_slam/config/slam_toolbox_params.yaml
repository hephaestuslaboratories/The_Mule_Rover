slam_toolbox:
  ros__parameters:

    # ── Frames ────────────────────────────────────────────────────────────────
    odom_frame:  odom
    map_frame:   map
    base_frame:  base_link
    # Consume deskewed + sanitised scans directly.  slam_turn_gate was removed
    # from the SLAM launch stack — per-ray IMU motion compensation in
    # scan_deskew is strictly better than blanket scan suppression, and the
    # gate was starving the scan-matcher during turns which caused map→odom
    # drift to accumulate without correction.
    scan_topic:  /scan_filtered

    # ── Mode ──────────────────────────────────────────────────────────────────
    mode: mapping          # use 'localization' when loading a saved map
    use_map_saver: true

    # ── Performance ───────────────────────────────────────────────────────────
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02   # seconds (50 Hz TF)
    map_update_interval: 2.0         # seconds between map publishes
    resolution: 0.05                 # meters per cell
    minimum_laser_range: 0.2         # A1M8 minimum range (avoids warning)
    max_laser_range: 12.0            # clip to A1M8 max range
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # ── Scan matching ─────────────────────────────────────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.05     # meters before processing new scan
    minimum_travel_heading: 0.087      # radians
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    # Lowered from 0.65 → 0.58 to allow slam_toolbox to accept slightly-less-
    # confident matches produced during turns (deskewed scans still carry
    # residual range noise from rapid body motion).  Previous 0.65 caused the
    # matcher to reject mid-turn scans, leaving only gyro to integrate pose
    # → visible map→odom drift on multi-turn sequences.
    link_match_minimum_response_fine: 0.58
    link_scan_maximum_distance: 1.5

    # ── Loop closure ──────────────────────────────────────────────────────────
    do_loop_closing: true
    loop_search_maximum_distance: 4.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.55  # Increased from 0.45 — stricter loop closure matching

    # ── Correlation ───────────────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Scan matcher penalties ────────────────────────────────────────────────
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.5
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ── Solver ────────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
